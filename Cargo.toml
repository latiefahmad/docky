[workspace]
resolver = "3"
members = ["crates/*", "apps/dock", "apps/settings/src-tauri", "spikes"]

[workspace.package]
version = "1.0.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
windows = "0.62"
windows-core = "0.62"
windows-numerics = "0.3"
docky-config = { path = "crates/docky-config" }
docky-core = { path = "crates/docky-core" }
docky-shell = { path = "crates/docky-shell" }

[workspace.lints.clippy]
perf = { level = "deny", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
# A failure closes the process: the guardian restores the Windows taskbar.
panic = "abort"
